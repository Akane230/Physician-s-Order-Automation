[package]
name = "orders_core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chrono = "0.4.45"
getrandom = "0.3.4"
keyring = "4.2.0"
lopdf = "0.45.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
